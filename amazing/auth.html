<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: Arial, sans-serif; }
        .amz-connect-screen { position: absolute; inset: 0; z-index: 1000; display: flex; justify-content: center; align-items: flex-start; padding-top: 4vh; }
        .amz-connect-pill { min-width: 330px; height: 70px; padding: 0 30px 0 16px; display: flex; align-items: center; gap: 16px; color: #fff; font-size: 16px; font-weight: 800; border: 2px solid rgba(150, 204, 255, .82); border-radius: 40px; background: linear-gradient(105deg, rgba(89, 157, 239, .94), rgba(41, 115, 224, .96)); box-shadow: 0 12px 35px rgba(0, 77, 190, .38), inset 0 1px 0 rgba(255, 255, 255, .28); }
        .amz-connect-dots { width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; gap: 4px; }
        .amz-connect-dots i { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: amz-dot 1.1s infinite ease-in-out; }
        .amz-connect-dots i:nth-child(2) { animation-delay: .15s; }
        .amz-connect-dots i:nth-child(3) { animation-delay: .3s; }
        @keyframes amz-dot { 0%, 70%, 100% { opacity: .35; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }
    </style>
</head>
<body>
    <div class="amz-connect-screen">
        <div class="amz-connect-pill">
            <span class="amz-connect-dots"><i></i><i></i><i></i></span>
            <span>Подключение к серверу</span>
        </div>
    </div>
<script>
(function () {
    window.location.replace('auth-app.html' + (window.location.search || ''));
})();
</script>
</body>
</html>
