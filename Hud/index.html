<style>
    body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
</style>
<body>
    <div id="admin-spec-root" style="display:none"></div>
    <iframe id="spec-chat-frame" src="chat/index.html?v=1" title="Игровой чат"
      style="display:none;position:fixed;inset:0;width:100vw;height:100vh;border:0;z-index:2147483001;pointer-events:none;background:transparent"></iframe>
    <template id="admin-spec-template">
      <main class="cef-root" id="cefRoot">
        <aside class="info-panel" id="infoPanel">
          <h1 title="Зажми и перетащи, чтобы переместить">ИНФОРМАЦИЯ <span class="drag-hint">⠿</span></h1>
          <div class="rows">
            <div class="row"><span>Здоровье</span><b id="hp">0</b></div>
            <div class="row"><span>Броня</span><b id="armor">0</b></div>
            <div class="row"><span>Уровень</span><b id="level">0</b></div>
          </div>
          <div class="rows split">
            <div class="row"><span>Фракция</span><b id="fraction">Гражданский</b></div>
            <div class="row"><span>Семья</span><b id="family">Нет</b></div>
          </div>
          <div class="rows split">
            <div class="row"><span>Транспорт</span><b id="vehicle">Нет</b></div>
            <div class="row"><span>Розыск</span><b id="wanted">0</b></div>
            <div class="row"><span>Зеленая зона</span><b class="green" id="greenZone">Да</b></div>
            <div class="row"><span>Виртуальный мир</span><b class="blue" id="virtualWorld">0</b></div>
            <div class="row"><span>Скорость</span><b><span id="speed">0</span> км/ч</b></div>
          </div>
          <div class="rows split compact">
            <div class="row"><span>FPS</span><b class="green" id="fps">0</b></div>
            <div class="row"><span>Соединение</span><b class="red" id="ping">0</b></div>
          </div>
          <div class="player-filter"><span>Все игроки</span><b>⌄</b></div>
          <button class="hide-info" id="hideInfo" type="button">СКРЫТЬ ИНФО (CTRL)</button>
        </aside>
        <section class="command-dock with-name" id="commandDock" aria-label="Команды администратора">
          <div class="target-name"><span id="playerName">Savelii_Kentry</span> [<span id="playerId">717</span>] <span class="role-badge role-player" id="playerRole">Игрок</span></div>
          <div class="dock-row">
            <div class="button-grid" id="buttonGrid">
              <button class="cmd green" data-action="move">MOVE</button>
              <button class="cmd green" data-action="flip">FLIP</button>
              <button class="cmd green" data-action="gruz">GRUZ</button>
              <button class="cmd orange" data-action="nexuz">NEXUZ</button>
              <button class="cmd orange" data-action="getinfo">GETINFO</button>
              <button class="cmd blue" data-action="up">UP</button>
              <button class="cmd blue" data-action="down">DOWN</button>
              <button class="cmd red extra" data-action="freeze">FREEZE</button>
              <button class="cmd brown extra" data-action="nick">NICK</button>
              <button class="cmd red extra" data-action="delgun">DELGUN</button>
              <button class="cmd brown extra infopunish" data-action="infopunish">INFOPUNISH</button>
              <button class="cmd brown extra" data-action="time">TIME</button>
              <button class="cmd blue extra" data-action="goto">GOTO</button>
              <button class="cmd blue extra" data-action="spawn">SPAWN</button>
              <button class="cmd red extra" data-action="pg">PG</button>
              <button class="cmd blue extra" data-action="exit">EXIT</button>
            </div>
            <div class="dock-tools">
              <button id="expandButton" class="tool info-tool" title="Свернуть или развернуть команды" aria-label="Свернуть или развернуть команды"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg></button>
              <button id="closeButton" class="tool exit-tool" title="Закрыть панель" aria-label="Закрыть панель"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/><path d="M10 17l5-5-5-5M15 12H3"/></svg></button>
            </div>
          </div>
        </section>
        <div class="toast" id="toast" role="status"></div>
      </main>
      <button class="reopen" id="reopenButton">ОТКРЫТЬ СПЕК</button>
    </template>
    <div class="amazing-main-hud-block">
        <div class="hud-top">
            <div class="pill pill-time"><b>{{ currentTime }}</b><span class="dot">&middot;</span><span class="muted">{{ currentDate }}</span></div>
            <div class="pill pill-name"><span class="pname">{{ getInterface() }}</span><span class="idbadge" :class="idClass">{{ id }}</span></div>
        </div>
        <div class="hud-logo"><span class="l1">ABSOLUTE</span><span class="l2">online</span></div>
        <div class="hud-bottom">
            <div class="hud-weapon" v-if="weapon > 0">
                <img :src="`assets/images/weapons/${weapon}.png`" @error="$event.target.style.display='none'" />
                <div class="pill pill-ammo" v-if="isWeaponFire"><b>{{ ammoNow }}</b><span class="muted">/{{ ammoLeft }}</span><i class="round gray"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M7 9a3 3 0 1 0 0 6c3 0 7-6 10-6a3 3 0 1 1 0 6c-3 0-7-6-10-6z"/></svg></i></div>
            </div>
            <div class="hud-stats">
                <div class="pill pill-stat pill-wanted" v-if="wanted > 0"><b>{{ wanted }}</b><i class="round amber"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg></i></div>
                <div class="pill pill-stat pill-armour"><b>{{ armour }}</b><i class="round white"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg></i></div>
                <div class="pill pill-stat pill-health"><b>{{ health }}</b><div class="bar"><i :style="{ width: healthPercent + '%' }"></i></div><i class="round red"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg></i></div>
                <div class="pill pill-stat pill-money"><b>{{ formatNumber(money) }}</b><i class="round green"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 7a3 3 0 0 1 3-3h12v3H6a1 1 0 0 0 0 2h14v10a2 2 0 0 1-2 2H6a3 3 0 0 1-3-3z"/><circle cx="16.5" cy="14.5" r="1.5" fill="#1f9d4f"/></svg></i></div>
            </div>
        </div>
    </div>
