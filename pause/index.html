<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пауза</title>
<style>
:root{--acc:#e8b04a;--acc2:#f5cf86;--txt:#fff;--mut:rgba(255,255,255,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:rgba(0,0,0,.55);color:var(--txt);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;cursor:default}
.card{position:fixed;left:2.4%;right:2.4%;top:18px;border-radius:22px;padding:28px 46px 18px;
 background:radial-gradient(520px 260px at 30% 0,rgba(214,160,40,.85),rgba(214,160,40,0) 70%),linear-gradient(90deg,#6b4f1d 0%,#2a2218 60%,#1b1b1b 100%);
 box-shadow:0 18px 50px rgba(0,0,0,.55);animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.logo{font-weight:900;font-size:34px;line-height:.9;letter-spacing:.02em}
.logo small{display:block;color:rgba(255,255,255,.55);font-size:25px;letter-spacing:.1em}
.mid{position:absolute;left:0;right:0;top:30px;text-align:center}
.mid b{display:block;font-size:24px;font-weight:600;letter-spacing:.06em}
.mid span{font-size:13px;color:var(--mut)}
.mid i{display:block;font-style:normal;font-size:12px;color:var(--acc2);margin-top:4px}
.sep{height:1px;background:rgba(255,255,255,.22);margin:58px 0 14px}
.btns{display:flex;justify-content:center;gap:14px}
.b{border:0;background:transparent;color:#fff;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:11px 22px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.b:hover{background:rgba(255,255,255,.16)}
.b.main{background:#cdb88a;color:#2a2113;font-weight:600}
.b.main:hover{background:#ddc998}
.b.danger:hover{background:rgba(255,77,94,.35)}
.b:disabled{opacity:.45;cursor:default}
.foot{position:fixed;left:2.4%;right:2.4%;bottom:14px;height:50px;border-radius:18px;background:rgba(30,30,30,.9);border:1px solid rgba(255,255,255,.07);display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:0 28px;font-size:11px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.confirm{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6)}
.confirm.on{display:grid}
.cbox{background:#1d1d22;border:1px solid #33333b;border-radius:16px;padding:26px 32px;text-align:center;min-width:340px}
.cbox p{margin-bottom:18px;font-size:15px}
.cbox .b{background:#2a2a31;margin:0 6px}
.cbox .b.yes{background:var(--acc);color:#241a07;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo">ABSOLUTE<small>ONLINE</small></div>
  <div class="mid"><b id="title">ПАУЗА</b><span id="nick"></span><i id="sess">00:00</i></div>
  <div class="sep"></div>
  <div class="btns">
    <button class="b main" id="bResume">Продолжить</button>
    <button class="b" id="bSettings">Настройки</button>
    <button class="b" id="bReconnect">Переподключиться</button>
    <button class="b danger" id="bQuit">Выйти из игры</button>
  </div>
</div>
<div class="foot"><span>Absolute Online</span><span>ESC — закрыть</span></div>
<div class="confirm" id="cf"><div class="cbox"><p id="cfT"></p><button class="b yes" id="cfY">Да</button><button class="b" id="cfN">Отмена</button></div></div>
<script>
const hasCef=typeof cef!=='undefined'&&cef&&typeof cef.emit==='function';
const emit=(e,a)=>{if(hasCef)cef.emit(e,a==null?'':String(a));else console.log('emit',e,a)};
const $=id=>document.getElementById(id);
let pending=null,t0=Date.now();
const act=a=>emit('pause:action',a);

$('bResume').onclick=()=>act('resume');
$('bSettings').onclick=()=>act('settings');
function ask(text,a){pending=a;$('cfT').textContent=text;$('cf').classList.add('on')}
$('bReconnect').onclick=()=>ask('Переподключиться к серверу?','reconnect');
$('bQuit').onclick=()=>ask('Выйти из игры?','quit');
$('cfN').onclick=()=>{pending=null;$('cf').classList.remove('on')};
$('cfY').onclick=()=>{if(pending)act(pending);pending=null;$('cf').classList.remove('on')};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();
    if($('cf').classList.contains('on')){$('cfN').click();return}
    act('resume')}
});
document.addEventListener('contextmenu',e=>e.preventDefault());

// session timer (server may overwrite via pause:data)
function tick(){const s=Math.floor((Date.now()-t0)/1000),m=Math.floor(s/60);
  $('sess').textContent='В паузе: '+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(tick,1000);tick();
function onData(d){if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){return}}
  if(d.name)$('nick').textContent=d.name+(d.id!=null?' ['+d.id+']':'')}
if(hasCef&&typeof cef.on==='function'){cef.on('pause:data',onData);emit('pause:ready','')}
else{onData({name:'Luis_Topovich',id:0})}
</script>
</body>
</html>
